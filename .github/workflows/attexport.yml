name: ATT Export

on:
  workflow_dispatch:

jobs:
  checkout:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          repository: ATTWoWAddon/AllTheThings
          ref: master
          path: att-repo
          sparse-checkout: /.contrib/**
          sparse-checkout-cone-mode: false

      - name: Run parser
        shell: pwsh
        working-directory: att-repo/.contrib/.tools
        run: '& .\Parser.exe debug-nolog baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/shared/.config/debug.config"'

      - name: Upload results
        uses: actions/upload-artifact@v6
        with:
          path: att-repo/.contrib/Debugging/**/*.json