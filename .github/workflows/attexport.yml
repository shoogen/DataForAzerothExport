name: ATT Export

on:
  workflow_dispatch:

jobs:
  checkout:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          repository: ATTWoWAddon/AllTheThings
          ref: master

      - name: Run parser
        shell: pwsh
        working-directory: .contrib/.tools
        run: '& .\Parser.exe debug-nolog baseconfig="../.db/standard/.config/retail/retail.config" config="../.db/shared/.config/debug.config"'

      - name: List output files
        shell: pwsh
        working-directory: .contrib/.tools
        run: |
          Get-ChildItem . -Recurse -File |
            Select-Object FullName, Length